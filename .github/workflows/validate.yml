name: Validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # HACS and hassfest rules change without this repository changing, so
    # revalidate weekly rather than only on push.
    - cron: "0 3 * * 1"
  workflow_dispatch:

jobs:
  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          # The brands check requires listing in home-assistant/brands, which
          # only applies to the HACS default store. This is a custom repository.
          ignore: brands

  tests:
    name: Import and test against Home Assistant
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Home Assistant
        run: pip install --quiet homeassistant
      - name: Import the integration
        # compileall passes a module that fails at import time; importing does not.
        run: python -c "import custom_components.steward, custom_components.steward.config_flow, custom_components.steward.tools"
      - name: Run the suites
        run: |
          for t in tests/test_integration.py tests/test_config_tools.py tests/test_audit.py tests/test_oauth_client.py; do
            echo "== $t"; python -u "$t" > out.log 2>&1 || { tail -40 out.log; exit 1; }
          done
